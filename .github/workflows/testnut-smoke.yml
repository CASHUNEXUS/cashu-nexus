name: Testnut mint smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testnut-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run local syntax and unit checks
        run: npm run check
      - name: Connect to public Testnut mint (read-only smoke test)
        run: npm run check:mint
