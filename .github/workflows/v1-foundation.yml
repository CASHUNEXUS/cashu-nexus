name: v1 foundation checks

on:
  push:
    branches: [v1.0-foundation]
  pull_request:
    branches: [main, v1.0-foundation]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run syntax and unit checks
        run: npm run check
